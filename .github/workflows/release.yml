name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: version to build, e.g. 1.0.0
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fassung:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      wert: ${{ steps.lesen.outputs.wert }}
    steps:
      # The version comes either from the tag or from the dispatch input. It is read through
      # the environment and checked against a pattern, so nothing can be smuggled into the
      # shell through it.
      - id: lesen
        env:
          AUS_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          AUS_HAND: ${{ inputs.version }}
        run: |
          set -eu
          wert="${AUS_TAG#v}"
          [ -n "$wert" ] || wert="$AUS_HAND"
          case "$wert" in
            [0-9]*.[0-9]*.[0-9]*) : ;;
            *) echo "Fassung '$wert' sieht nicht wie 1.2.3 aus"; exit 1 ;;
          esac
          printf 'wert=%s\n' "$wert" >> "$GITHUB_OUTPUT"

  windows-and-linux:
    needs: fassung
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
      - name: build
        env:
          FASSUNG: ${{ needs.fassung.outputs.wert }}
        run: |
          set -eu
          mkdir -p dist
          marke="-s -w -X github.com/Dschonas04/sendr/internal/dienst.Version=${FASSUNG}"
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "$marke" -o dist/Sendr.exe ./cmd/sendr
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "$marke" -o dist/sendr-linux-amd64 ./cmd/sendr
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "$marke" -o dist/sendr-linux-arm64 ./cmd/sendr
          (cd dist && sha256sum * > pruefsummen-windows-linux.txt)
      # Signs a statement "this file came out of this workflow, from this commit", which
      # anyone can check with: gh attestation verify Sendr.exe -R Dschonas04/sendr
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/Sendr.exe
            dist/sendr-linux-amd64
            dist/sendr-linux-arm64
      - uses: actions/upload-artifact@v7
        with:
          name: windows-linux
          path: dist/*

  macos:
    needs: fassung
    runs-on: macos-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
      - name: build app bundle and dmg
        env:
          FASSUNG: ${{ needs.fassung.outputs.wert }}
        run: |
          set -eu
          marke="-s -w -X github.com/Dschonas04/sendr/internal/dienst.Version=${FASSUNG}"
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags "$marke" -o sendr-amd64 ./cmd/sendr
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "$marke" -o sendr-arm64 ./cmd/sendr
          lipo -create -output sendr-universal sendr-amd64 sendr-arm64
          paket="dist/Sendr.app"
          mkdir -p "$paket/Contents/MacOS"
          cp sendr-universal "$paket/Contents/MacOS/sendr"
          chmod +x "$paket/Contents/MacOS/sendr"
          cat > "$paket/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Sendr</string>
            <key>CFBundleDisplayName</key><string>Sendr</string>
            <key>CFBundleIdentifier</key><string>io.github.dschonas04.sendr</string>
            <key>CFBundleVersion</key><string>${FASSUNG}</string>
            <key>CFBundleShortVersionString</key><string>${FASSUNG}</string>
            <key>CFBundleExecutable</key><string>sendr</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>LSUIElement</key><true/>
            <key>NSLocalNetworkUsageDescription</key>
            <string>Sendr sucht im lokalen Netz nach Geräten, an die es Dateien senden kann.</string>
            <key>NSBonjourServices</key>
            <array><string>_sendr._tcp</string></array>
          </dict>
          </plist>
          PLIST
          # Ad-hoc signature: no paid certificate, but the bundle is sealed, so macOS
          # notices any later tampering instead of running it silently.
          codesign --force --deep --sign - --timestamp=none "$paket"
          codesign --verify --strict --verbose=2 "$paket"
          hdiutil create -volname Sendr -srcfolder "$paket" -ov -format UDZO "dist/Sendr-${FASSUNG}-macos.dmg"
          rm -rf "$paket"
          (cd dist && shasum -a 256 * > pruefsummen-macos.txt)
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/Sendr-*-macos.dmg
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*

  veroeffentlichen:
    needs: [windows-and-linux, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: alle
      - run: ls -R alle
      - uses: softprops/action-gh-release@v3
        with:
          files: alle/**/*
          generate_release_notes: true
          fail_on_unmatched_files: true
